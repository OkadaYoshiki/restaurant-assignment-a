spring.application.name=restaurant-app

# ===== MySQL 接続設定 =====
# 自分の環境に合わせてユーザー名・パスワードを書き換えてください。
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=restaurant
spring.datasource.password=restaurant

# ===== JPA 設定 =====
# テーブルは sql/01_schema.sql で作成済みのものを使います。
# none : アプリはテーブルを作らない・変更しない
spring.jpa.hibernate.ddl-auto=none
# 実行されるSQLをコンソールに表示する（学習用）
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
