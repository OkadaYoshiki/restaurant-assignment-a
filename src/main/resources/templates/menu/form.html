<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${menuId == null ? 'メニュー登録' : 'メニュー編集'})}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1 th:text="${menuId == null} ? 'メニュー登録' : 'メニュー編集'">メニュー登録</h1>
    <div th:replace="~{fragments :: messages}"></div>

    <div class="card">
        <form th:action="${menuId == null} ? @{/menu/new} : @{/menu/{id}/edit(id=${menuId})}"
              th:object="${menuForm}" method="post">
            <div class="field">
                <label for="name">メニュー名</label>
                <input type="text" id="name" th:field="*{name}">
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="field">
                <label for="category">種類</label>
                <select id="category" th:field="*{category}">
                    <option value="">-- 選択してください --</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}">メイン</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>
            <div class="field">
                <label for="price">価格（税抜・円）</label>
                <input type="number" id="price" th:field="*{price}">
                <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            <div class="field">
                <label><input type="checkbox" th:field="*{available}"> 販売中</label>
            </div>
            <button type="submit" class="btn" th:text="${menuId == null} ? '登録する' : '更新する'">登録する</button>
            <a class="btn btn-sub" th:href="@{/menu}">戻る</a>
        </form>
    </div>
</main>
</body>
</html>
