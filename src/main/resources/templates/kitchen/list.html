<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('キッチン')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>キッチン（提供待ち）</h1>
    <div th:replace="~{fragments :: messages}"></div>

    <p th:text="'提供待ち：' + ${#lists.size(items)} + '件（注文の古い順）'">提供待ち：0件</p>
    <p th:if="${#lists.isEmpty(items)}">提供待ちの料理はありません。</p>

    <table th:unless="${#lists.isEmpty(items)}">
        <thead>
        <tr><th>注文時刻</th><th>経過</th><th>席</th><th>メニュー</th><th class="num">数量</th><th>操作</th></tr>
        </thead>
        <tbody>
        <tr th:each="i : ${items}">
            <td th:text="${#temporals.format(i.orderedAt, 'HH:mm')}">18:05</td>
            <td th:text="${i.waitingMinutes(now)} + '分'">3分</td>
            <td th:text="${i.customerOrder.diningTable.name}">A1</td>
            <td th:text="${i.menuItem.name}">ハンバーグ定食</td>
            <td class="num" th:text="${i.quantity}">1</td>
            <td>
                <!-- TODO 課題A-3：「提供済みにする」ボタンを追加する
                     ・/kitchen/{id}/serve へ POST で送るフォーム（class="inline"）。id は明細の i.id -->
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
